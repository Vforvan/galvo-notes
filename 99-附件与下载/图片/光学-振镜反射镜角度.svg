<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" width="1120" height="760" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#d32f2f"/>
    </marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/>
    </marker>
    <style>
      .t   { font-size:13px; fill:#212121; }
      .tb  { font-size:14px; font-weight:700; fill:#212121; }
      .ts  { font-size:11px; fill:#616161; }
      .cap { font-size:12px; fill:#424242; }
      .axis{ stroke:#9e9e9e; stroke-width:1; stroke-dasharray:6,5; }
      .mir { stroke:#1565c0; stroke-width:4; stroke-linecap:round; }
      .ok  { fill:#e8f5e9; stroke:#388e3c; stroke-width:1.5; }
      .warn{ fill:#fff8e1; stroke:#f9a825; stroke-width:1.5; }
      .gray{ fill:#fafafa; stroke:#bdbdbd; stroke-width:1.5; }
    </style>
  </defs>

  <text x="560" y="26" style="font-size:19px;font-weight:700;fill:#212121;text-anchor:middle">振镜反射镜：机械角与光学角差 2 倍 + 大入射角 + 偏振副作用</text>

  <!-- ================= ① 反射定律 ================= -->
  <rect x="24" y="44" width="520" height="316" rx="8" fill="#fafcff" stroke="#bbdefb" stroke-width="1.5"/>
  <text x="44" y="68" class="tb" fill="#1565c0">① 镜面转 Δ → 光线偏转 2Δ</text>

  <!-- 法线（垂直） -->
  <line x1="230" y1="330" x2="230" y2="112" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="6,5"/>
  <text x="236" y="124" class="ts">法线</text>

  <!-- 原始镜面（水平） -->
  <line x1="96" y1="330" x2="368" y2="330" stroke="#90a4ae" stroke-width="4" stroke-linecap="round"/>
  <text x="96" y="350" class="ts">原始镜面位置（0°）</text>

  <!-- 转过 Δ 的镜面：+25.6°，过 (230,330) -->
  <line x1="134" y1="284" x2="330" y2="354" class="mir"/>
  <text x="336" y="358" class="ts" fill="#1565c0" font-weight="700">转过 Δ 的镜面</text>

  <!-- 入射光（垂直向上） -->
  <line x1="230" y1="330" x2="230" y2="170" stroke="#d32f2f" stroke-width="2.2" marker-end="url(#a1)"/>
  <text x="150" y="196" class="ts" fill="#d32f2f" font-weight="700">入射光</text>

  <!-- 原反射光（沿法线返回） -->
  <line x1="230" y1="330" x2="230" y2="196" stroke="#90a4ae" stroke-width="1.8" stroke-dasharray="6,4"/>
  <text x="238" y="176" class="ts" fill="#78909c">原反射光（0°）</text>

  <!-- 新反射光：偏转 2Δ，向右上 -->
  <line x1="230" y1="330" x2="360" y2="168" stroke="#1565c0" stroke-width="2.2" marker-end="url(#a2)"/>
  <text x="276" y="240" class="ts" fill="#1565c0" font-weight="700">新反射光</text>
  <text x="276" y="256" class="ts" fill="#1565c0">（偏 2Δ）</text>

  <!-- 2Δ 弧 -->
  <path d="M230,270 A60,60 0 0 1 277,225" fill="none" stroke="#1565c0" stroke-width="1.6"/>
  <text x="272" y="272" class="ts" fill="#1565c0" font-weight="700">2Δ</text>

  <!-- Δ 弧（镜面转角） -->
  <path d="M290,330 A60,60 0 0 0 278,255" fill="none" stroke="#78909c" stroke-width="1.4"/>
  <text x="298" y="300" class="ts" fill="#78909c">Δ</text>

  <!-- 结论框 -->
  <rect x="44" y="86" width="188" height="76" rx="6" class="ok"/>
  <text x="60" y="110" class="cap" font-weight="700" fill="#2e7d32">光学角 = 2 × 机械角</text>
  <text x="60" y="132" class="cap" fill="#c62828">⚠️ 说明书说"±20°"时</text>
  <text x="60" y="150" class="ts" fill="#c62828">必须先确认是哪种角</text>

  <!-- ================= ② 大入射角 ================= -->
  <rect x="564" y="44" width="532" height="316" rx="8" fill="#fffdf5" stroke="#ffe082" stroke-width="1.5"/>
  <text x="584" y="68" class="tb" fill="#b26a00">② 镜片工作在【大入射角】下</text>

  <!-- 镜面 45° 基准：过 (760,270)，限制在面板内 -->
  <line x1="680" y1="350" x2="838" y2="192" class="mir"/>
  <text x="760" y="374" class="ts" fill="#1565c0">镜面（45° 基准位置）</text>

  <!-- 法线（垂直镜面，斜率 +1） -->
  <line x1="788" y1="298" x2="832" y2="342" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="6,5"/>
  <text x="776" y="362" class="ts">法线</text>

  <!-- 入射光（水平，从左侧打到镜面） -->
  <line x1="596" y1="270" x2="760" y2="270" stroke="#d32f2f" stroke-width="2.2" marker-end="url(#a1)"/>
  <text x="596" y="256" class="ts" fill="#d32f2f" font-weight="700">入射光（水平）</text>

  <!-- 反射光（垂直向下） -->
  <line x1="760" y1="270" x2="760" y2="330" stroke="#1565c0" stroke-width="2.2" marker-end="url(#a2)"/>
  <text x="766" y="326" class="ts" fill="#1565c0" font-weight="700">反射光</text>

  <!-- AOI 弧（45°） -->
  <path d="M712,270 A48,48 0 0 1 760,318" fill="none" stroke="#b26a00" stroke-width="1.6"/>
  <text x="716" y="306" class="ts" fill="#b26a00" font-weight="700">45°</text>

  <!-- 摆动范围（±20° 的两个极限位置，虚线） -->
  <line x1="760" y1="270" x2="664" y2="366" stroke="#1565c0" stroke-width="1.3" stroke-dasharray="4,3" opacity="0.55"/>
  <line x1="760" y1="270" x2="856" y2="174" stroke="#1565c0" stroke-width="1.3" stroke-dasharray="4,3" opacity="0.55"/>
  <text x="638" y="360" class="ts" fill="#1565c0" opacity="0.85">-20°</text>
  <text x="834" y="172" class="ts" fill="#1565c0" opacity="0.85">+20°</text>

  <rect x="586" y="88" width="492" height="106" rx="6" class="warn"/>
  <text x="602" y="112" class="cap" font-weight="700" fill="#b26a00">镜面转 ±20° 时，入射角在 45°±20° 范围变化</text>
  <text x="602" y="136" class="cap">即 <tspan font-weight="700">25° ～ 65°</tspan>（Thorlabs GVS102 实测 32.5°–57.5°）</text>
  <text x="602" y="162" class="cap" fill="#c62828">⚠️ 介质膜按入射角设计：AOI 增大 → 中心波长【蓝移】</text>
  <text x="602" y="184" class="cap" fill="#c62828">→ 镀膜必须按实际 AOI 范围定制，否则功率白丢</text>

  <!-- ================= ③ 偏振副作用 ================= -->
  <rect x="24" y="380" width="1072" height="348" rx="8" fill="#fafafa" stroke="#bdbdbd" stroke-width="1.5"/>
  <text x="44" y="406" class="tb">③ 副作用：金属膜反射 = "会动的不良波片"</text>

  <!-- 光路：水平 → X 镜 → 向上 → Y 镜 → 向右 → 输出 -->
  <!-- X 镜（过反射点 300,560） -->
  <line x1="262" y1="598" x2="338" y2="522" class="mir"/>
  <text x="288" y="624" class="ts" fill="#1565c0" font-weight="700">X 镜</text>

  <!-- Y 镜（过反射点 560,440，下端收在 592,472） -->
  <line x1="528" y1="408" x2="592" y2="472" class="mir"/>
  <text x="588" y="404" class="ts" fill="#1565c0" font-weight="700">Y 镜</text>

  <!-- 入射（水平） -->
  <line x1="90" y1="560" x2="300" y2="560" stroke="#d32f2f" stroke-width="2.2"/>
  <line x1="268" y1="540" x2="268" y2="580" stroke="#d32f2f" stroke-width="3.5"/>
  <text x="94" y="540" class="ts" fill="#d32f2f" font-weight="700">线偏振入射</text>

  <!-- X 镜反射：向上 -->
  <line x1="300" y1="560" x2="300" y2="440" stroke="#d32f2f" stroke-width="2.2"/>

  <!-- Y 镜反射：向右 -->
  <line x1="300" y1="440" x2="700" y2="440" stroke="#d32f2f" stroke-width="2.2"/>

  <!-- 反射点 -->
  <circle cx="300" cy="560" r="4.5" fill="#1565c0"/>
  <circle cx="560" cy="440" r="4.5" fill="#1565c0"/>

  <!-- X 镜后标注（移到下方，避开 X 镜标签） -->
  <text x="330" y="592" class="ts" fill="#c62828">延迟 ≤0.4 rad（≈23°）</text>
  <text x="330" y="610" class="ts" fill="#c62828">二向衰减 ≤5%</text>

  <!-- Y 镜后标注 -->
  <text x="352" y="424" class="ts" fill="#c62828">累积延迟【不互相抵消】</text>
  <text x="352" y="408" class="ts" fill="#c62828">Φ₂ 同时依赖两轴转角</text>

  <!-- 输出椭圆偏振 -->
  <ellipse cx="742" cy="440" rx="30" ry="15" fill="none" stroke="#8e24aa" stroke-width="2.4" transform="rotate(-22 742 440)"/>
  <text x="700" y="500" class="ts" fill="#8e24aa" font-weight="700">输出：椭圆偏振</text>
  <text x="700" y="518" class="ts" fill="#8e24aa">"完全不再保持线偏振"</text>

  <!-- 后果框 -->
  <rect x="826" y="416" width="252" height="290" rx="6" class="warn"/>
  <text x="842" y="440" class="cap" font-weight="700" fill="#b26a00">后果</text>
  <text x="842" y="466" class="cap">偏振态随【扫描位置】变化</text>
  <text x="842" y="488" class="cap" fill="#c62828">→ 无法在振镜之后用</text>
  <text x="842" y="506" class="cap" fill="#c62828">　静态波片统一校正</text>
  <line x1="842" y1="522" x2="1062" y2="522" stroke="#e0e0e0" stroke-width="1"/>
  <text x="842" y="546" class="cap" font-weight="700">缓解路径</text>
  <text x="842" y="570" class="cap">① 用【圆偏振】输入</text>
  <text x="842" y="590" class="cap">　（把方向性伪影平均掉）</text>
  <text x="842" y="612" class="cap">② 换银镀层（s/p 差异小）</text>
  <text x="842" y="634" class="cap">③ 关键长焊缝走对角线</text>
  <line x1="842" y1="650" x2="1062" y2="650" stroke="#e0e0e0" stroke-width="1"/>
  <text x="842" y="672" class="ts" fill="#616161">全视场辐照度不均匀约 6%</text>
  <text x="842" y="690" class="ts" fill="#616161">（铝膜、±12.5°、GVS102 实测）</text>

  <text x="24" y="748" class="ts">依据：Thorlabs GVS102 偏振光线追迹（0.4 rad / 5% / 6%）、Anzolin 等 arXiv:1003.4357（振镜琼斯矩阵）、Laseroptik（AOI 蓝移）。</text>
</svg>
