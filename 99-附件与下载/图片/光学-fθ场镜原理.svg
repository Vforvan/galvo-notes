<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 740" width="1100" height="740" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#d32f2f"/>
    </marker>
    <style>
      .t   { font-size:13px; fill:#212121; }
      .tb  { font-size:14px; font-weight:700; fill:#212121; }
      .ts  { font-size:11px; fill:#616161; }
      .ray { stroke:#d32f2f; stroke-width:1.7; fill:none; }
      .lens{ fill:#fff4e1; stroke:#e0a800; stroke-width:2; }
      .axis{ stroke:#9e9e9e; stroke-width:1; stroke-dasharray:6,5; }
      .cap { font-size:12px; fill:#424242; }
      .ok  { fill:#e8f5e9; stroke:#388e3c; stroke-width:1.5; }
      .bad { fill:#ffe4e1; stroke:#d32f2f; stroke-width:1.5; }
    </style>
  </defs>

  <text x="550" y="28" style="font-size:19px;font-weight:700;fill:#212121;text-anchor:middle">F-θ 场镜：为什么需要它、它解决了什么</text>

  <!-- ================= 上：普通球面透镜 ================= -->
  <rect x="24" y="46" width="800" height="304" rx="8" fill="#fffafa" stroke="#ffcdd2" stroke-width="1.5"/>
  <text x="44" y="70" class="tb" fill="#c62828">❌ 普通球面聚焦镜</text>
  <text x="44" y="90" class="cap">落点 r = f·tanθ（非线性）　焦面是【球面】　→ 边缘拉伸、边缘离焦</text>

  <line x1="46" y1="212" x2="800" y2="212" class="axis"/>
  <text x="46" y="230" class="ts">光轴</text>

  <!-- 入射平行光 -->
  <line x1="46" y1="142" x2="280" y2="142" class="ray"/>
  <line x1="46" y1="212" x2="280" y2="212" class="ray"/>
  <line x1="46" y1="282" x2="280" y2="282" class="ray"/>
  <text x="46" y="126" class="ts">入射平行光（θ=0 情形）</text>

  <!-- 普通透镜 -->
  <path d="M280,120 Q312,212 280,304 Q248,212 280,120 Z" class="lens"/>
  <text x="280" y="330" class="ts" text-anchor="middle">普通聚焦镜</text>

  <!-- 会聚：中束在 680 交叉，边束在 740/620 交叉 -->
  <line x1="280" y1="142" x2="740" y2="220" class="ray"/>
  <line x1="280" y1="212" x2="680" y2="212" class="ray"/>
  <line x1="280" y1="282" x2="620" y2="204" class="ray"/>

  <!-- 理想焦平面（竖直虚线） -->
  <line x1="680" y1="150" x2="680" y2="300" stroke="#1565c0" stroke-width="2" stroke-dasharray="7,5"/>
  <text x="686" y="312" class="ts" fill="#1565c0">理想焦平面</text>

  <!-- 球面焦面 -->
  <path d="M620,204 A115,115 0 0 1 740,220" fill="none" stroke="#c62828" stroke-width="3.5"/>
  <text x="600" y="178" class="ts" fill="#c62828" font-weight="700">球面焦面</text>
  <text x="600" y="194" class="ts" fill="#c62828">（场曲）</text>

  <!-- 三个落点 -->
  <circle cx="680" cy="212" r="5" fill="#c62828"/>
  <circle cx="740" cy="220" r="5" fill="#c62828"/>
  <circle cx="620" cy="204" r="5" fill="#c62828"/>

  <!-- 边缘离焦标注 -->
  <line x1="740" y1="220" x2="740" y2="212" stroke="#c62828" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="620" y1="204" x2="620" y2="212" stroke="#c62828" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="626" y="326" class="ts" fill="#c62828">边缘落点偏离理想焦平面 → 离焦 + 位置误差</text>

  <!-- 右侧说明 -->
  <rect x="840" y="70" width="236" height="176" rx="6" class="bad"/>
  <text x="858" y="94" class="t" font-weight="700" fill="#c62828">两个问题</text>
  <text x="858" y="118" class="cap">① 落点按 tanθ 分布 → 拉伸</text>
  <text x="858" y="140" class="cap">② 焦面是球面 → 边缘离焦</text>
  <text x="858" y="170" class="cap">f=254、θ=30° 时</text>
  <text x="858" y="192" class="cap" font-weight="700" fill="#c62828">落点差 13.65 mm</text>
  <text x="858" y="214" class="cap">图形边框若要求 ±0.1 mm</text>
  <text x="858" y="234" class="cap">已经错了一百多倍</text>

  <!-- ================= 下：F-θ 场镜 ================= -->
  <rect x="24" y="366" width="800" height="336" rx="8" fill="#f7fff9" stroke="#c8e6c9" stroke-width="1.5"/>
  <text x="44" y="390" class="tb" fill="#2e7d32">✅ F-θ 场镜（强非对称多片空气间隔镜组）</text>
  <text x="44" y="410" class="cap">落点 r = f·θ（线性）　焦面【压平】　→ 全幅面均匀</text>

  <line x1="46" y1="534" x2="800" y2="534" class="axis"/>
  <text x="46" y="552" class="ts">光轴</text>

  <!-- 场镜组：三片 -->
  <path d="M280,446 Q308,534 280,622 Q252,534 280,446 Z" class="lens"/>
  <rect x="330" y="444" width="14" height="180" rx="5" class="lens"/>
  <path d="M396,456 Q420,534 396,612 Q372,534 396,456 Z" class="lens"/>
  <text x="340" y="644" class="ts" text-anchor="middle">F-θ 场镜（3 片示意）</text>

  <!-- 焦平面 -->
  <line x1="700" y1="430" x2="700" y2="644" stroke="#2e7d32" stroke-width="3.5"/>
  <text x="706" y="428" class="ts" fill="#2e7d32" font-weight="700">✅ 平坦焦面 r = f·θ</text>

  <!-- 光束 1：θ=0（水平入射，会聚到轴上） -->
  <line x1="46" y1="504" x2="280" y2="504" class="ray"/>
  <line x1="46" y1="564" x2="280" y2="564" class="ray"/>
  <line x1="280" y1="504" x2="700" y2="534" class="ray"/>
  <line x1="280" y1="564" x2="700" y2="534" class="ray"/>
  <text x="46" y="490" class="ts" fill="#1565c0">θ=0 入射</text>

  <!-- 光束 2：θ>0（倾斜入射，会聚到离轴点） -->
  <line x1="46" y1="598" x2="278" y2="574" class="ray"/>
  <line x1="46" y1="640" x2="278" y2="616" class="ray"/>
  <line x1="278" y1="574" x2="700" y2="488" class="ray"/>
  <line x1="278" y1="616" x2="700" y2="488" class="ray"/>
  <text x="46" y="662" class="ts" fill="#c62828">θ&gt;0 入射（倾斜）</text>

  <!-- 落点 -->
  <circle cx="700" cy="534" r="5" fill="#2e7d32"/>
  <circle cx="700" cy="488" r="5" fill="#c62828"/>

  <!-- r = fθ 的标注 -->
  <line x1="700" y1="534" x2="700" y2="488" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="700" y1="488" x2="764" y2="488" stroke="#1565c0" stroke-width="1.5"/>
  <text x="770" y="492" class="ts" fill="#1565c0">r = f·θ</text>
  <text x="770" y="508" class="ts" fill="#1565c0">（与 θ 成正比）</text>

  <!-- 说明框 -->
  <rect x="840" y="404" width="236" height="180" rx="6" class="ok"/>
  <text x="858" y="428" class="t" font-weight="700" fill="#2e7d32">怎么做到的</text>
  <text x="858" y="456" class="cap">故意设计成</text>
  <text x="858" y="478" class="cap" font-weight="700">桶形畸变</text>
  <text x="858" y="500" class="cap">去抵消 tanθ 的正误差</text>
  <text x="858" y="532" class="cap" fill="#c62828">⚠️ 所以它不能装反</text>
  <text x="858" y="552" class="cap" fill="#c62828">也不能随便换焦距</text>
  <text x="858" y="572" class="cap">畸变是按焦距配好的</text>

  <!-- 页脚 -->
  <text x="24" y="722" class="ts">镜片形状为示意；实际 F-θ 场镜为强非对称多片空气间隔结构。</text>
  <text x="24" y="736" class="ts">真实光路中振镜位于场镜之前——此处为聚焦原理示意，未画振镜。依据：Sill Optics 技术指南 / Thorlabs F-Theta 教程。</text>
</svg>
